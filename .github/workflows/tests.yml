name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):" tests.log | head -20 | while IFS= read -r line; do
              echo "::error title=unittest::$line"
            done
            echo "---- last 60 lines ----"
            tail -60 tests.log
          fi
          exit "$status"
